name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      JERU_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-test.txt'
      - name: Run tests without models or microphone recording
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          python -m pytest -q --basetemp artifacts/test-temp
